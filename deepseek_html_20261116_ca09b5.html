<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Классная работа — задания и проверка</title>
<style>
:root{
  --bg:#f2f5fb; --card:#fff; --ink:#1b2438; --muted:#7b87a0;
  --primary:#4f6ef7; --primary-d:#3a57d8; --ok:#16a34a; --warn:#f59e0b; --danger:#ef4444;
  --line:#e5eaf5; --radius:16px; --shadow:0 6px 24px rgba(35,55,110,.08);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
}
h1,h2,h3{margin:0 0 6px}
h1{font-size:26px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px} .ta-r{text-align:right}
button{font-family:inherit}

/* ---------- AUTH ---------- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 500px at 20% -10%, #dfe7ff 0%, transparent 60%),
             radial-gradient(900px 500px at 100% 0%, #e6fbf1 0%, transparent 55%), var(--bg);}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:22px;
  padding:34px 30px;box-shadow:var(--shadow);border:1px solid var(--line)}
.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),#7d8fff);color:#fff;font-weight:800;font-size:18px;letter-spacing:.5px}
.logo.small{width:34px;height:34px;border-radius:10px;font-size:13px}
.auth-card h1{margin-top:16px}
.auth-card p{margin:4px 0 22px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,110,247,.12)}
.role-toggle{display:flex;gap:8px;background:#eef1f9;padding:5px;border-radius:14px}
.role{flex:1;padding:10px;border:none;background:transparent;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
.role.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(35,55,110,.1)}

/* ---------- LAYOUT ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:12px 22px;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.userbox{display:flex;align-items:center;gap:10px;font-size:14px}
.container{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.tabs{display:flex;gap:6px;background:#e9edf8;padding:5px;border-radius:14px;margin-bottom:20px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;white-space:nowrap;padding:10px 14px;border:none;background:transparent;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(35,55,110,.09)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;
  border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--primary-d);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:#eef1f9;color:var(--ink)}
.btn.ghost:hover{background:#e2e7f6}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)} .btn.ok:hover{background:#128a3f}
.btn.block{width:100%;margin-top:20px;padding:13px}
.link{background:none;border:none;color:var(--primary);font-size:13px;font-weight:600;
  cursor:pointer;padding:4px 0}
.link:hover{text-decoration:underline}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1}

/* ---------- CHIPS / TASKS ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1.5px solid var(--line);
  border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);
  transition:.15s;user-select:none;background:#fff}
.chip:hover{border-color:#c7d3f5}
.chip.on{background:#eef1ff;border-color:var(--primary);color:var(--primary)}
.chip input{display:none}
.tasklist{max-height:320px;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px;
  padding-right:4px}
.task-item{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:12px;cursor:pointer;transition:.15s;background:#fff}
.task-item:hover{border-color:#c7d3f5;background:#fafbff}
.task-item.on{border-color:var(--primary);background:#f4f6ff}
.task-item input{width:auto;margin:2px 0 0;accent-color:var(--primary);cursor:pointer}
.task-item .tt{font-weight:600;font-size:14px}

/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow)}
.stat .num{font-size:28px;font-weight:800;line-height:1.1}
.stat .cap{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat.ok .num{color:var(--ok)} .stat.warn .num{color:var(--warn)} .stat.danger .num{color:var(--danger)}

/* ---------- TABLE ---------- */
.filters{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:720px){.filters{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;padding:12px 14px;background:#f7f9fe;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid #f0f3fa;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.is-done td{background:#fbfefc}
tr:hover td{background:#fafbff}
tr.is-done:hover td{background:#f6fdf9}
.empty{text-align:center;color:var(--muted);padding:34px 14px !important}

/* ---------- BADGES ---------- */
.badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge.ok{background:#e6f7ec;color:#128a3f}
.badge.warn{background:#fff5e0;color:#b47407}
.badge.danger{background:#feeaea;color:#c92a2a}
.badge-role{background:#eef1ff;color:var(--primary);padding:4px 10px;border-radius:8px;
  font-size:12px;font-weight:700}

/* ---------- PROGRESS ---------- */
.progress{height:8px;background:#eef1f9;border-radius:99px;overflow:hidden;min-width:90px}
.progress > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f6ef7,#7d8fff);
  transition:width .4s}
.progress.full > i{background:linear-gradient(90deg,#16a34a,#38d07a)}

/* ---------- STUDENT CARDS ---------- */
.acard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--primary);
  border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px;
  display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.acard.done{border-left-color:var(--ok);background:#fbfefc}
.acard.overdue{border-left-color:var(--danger)}
.acard .title{font-weight:700;font-size:16px;margin-bottom:3px}
.acard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--line);margin:20px 0}
.hint{background:#f4f6ff;border:1px dashed #c7d3f5;border-radius:12px;padding:12px 14px;
  font-size:13.5px;color:#4a5680}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid #f0f3fa}
.list-row:last-child{border-bottom:none}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1b2438;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;
  font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   ДАННЫЕ
   ===================================================================== */
const DB_KEY = 'teachboard_v1';

const DEFAULT_TASKS = [
  {id:'t1',  subject:'Математика',     title:'Учебник: № 145–152, стр. 48',        desc:'Квадратные уравнения'},
  {id:'t2',  subject:'Математика',     title:'Карточка «Дроби», вариант 2',        desc:'Сложение и сокращение дробей'},
  {id:'t3',  subject:'Русский язык',   title:'Упражнение 214, стр. 96',            desc:'Правописание НЕ и НИ'},
  {id:'t4',  subject:'Русский язык',   title:'Сочинение-миниатюра «Осенний парк»', desc:'120–150 слов'},
  {id:'t5',  subject:'Литература',     title:'Глава 3 «Евгения Онегина» + вопр. 1–5', desc:'Ответы письменно в тетради'},
  {id:'t6',  subject:'История',        title:'Параграф 12, вопросы 1–4',           desc:'Заполнить таблицу «Реформы»'},
  {id:'t7',  subject:'Физика',         title:'Задачи № 301–305',                   desc:'Закон Ома для участка цепи'},
  {id:'t8',  subject:'Биология',       title:'Лабораторная работа № 4',            desc:'Оформить выводы в тетради'},
  {id:'t9',  subject:'Английский язык',title:'Unit 4, ex. 5–6 + слова',            desc:'Неправильные глаголы'},
  {id:'t10', subject:'Информатика',    title:'Практика: алгоритмы ветвления',      desc:'Блок-схема + программа'}
];

/* =====================================================================
   ХРАНИЛИЩЕ
   ===================================================================== */
let db = loadDB();

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.tasks) && Array.isArray(d.assignments)) return d;
    }
  }catch(e){}
  return {
    tasks: DEFAULT_TASKS.slice(),
    students: ['Анна Смирнова','Иван Петров','Мария Козлова','Дмитрий Волков'],
    assignments: [],
    currentUser: null
  };
}
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

/* =====================================================================
   УТИЛИТЫ
   ===================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtDateStr = s => { const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'}); };

function isOverdue(a){
  if(a.done || !a.deadline) return false;
  return new Date(a.deadline + 'T23:59:59').getTime() < Date.now();
}

function toast(msg, type=''){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; }, 2400);
  setTimeout(()=> el.remove(), 2800);
}

/* =====================================================================
   СОСТОЯНИЕ ИНТЕРФЕЙСА
   ===================================================================== */
const ui = {
  authRole: 'teacher',
  tab: 'create',
  selStudents: new Set(),
  selTasks: new Set(),
  deadline: '',
  taskSubjectFilter: '',
  search: '',
  filterStudent: '',
  filterStatus: ''
};

/* =====================================================================
   ГЛАВНЫЙ РЕНДЕР
   ===================================================================== */
function render(){
  const root = document.getElementById('app');
  if(!db.currentUser){
    root.innerHTML = authScreen();
  } else if(db.currentUser.role === 'teacher'){
    root.innerHTML = teacherScreen();
  } else {
    root.innerHTML = studentScreen();
  }
  window.scrollTo({top:0});
}

/* =====================================================================
   ЭКРАН ВХОДА
   ===================================================================== */
function authScreen(){
  const isT = ui.authRole === 'teacher';
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo">КР</div>
      <h1>Классная работа</h1>
      <p class="muted">Выдавайте задания и следите за их выполнением</p>

      <div class="role-toggle">
        <button class="role ${isT?'active':''}" data-action="setRole" data-role="teacher">Учитель</button>
        <button class="role ${!isT?'active':''}" data-action="setRole" data-role="student">Ученик</button>
      </div>

      <label class="lbl">${isT ? 'Ваше имя' : 'Ваши имя и фамилия'}</label>
      <input id="authName" placeholder="${isT ? 'Например: Ольга Сергеевна' : 'Например: Анна Смирнова'}">

      ${!isT ? `<p class="small muted" style="margin-top:10px">Введите имя так, как вас записал учитель — иначе он не увидит ваши задания.</p>` : ''}

      <button class="btn block" data-action="login">Войти</button>
    </div>
  </div>`;
}

/* =====================================================================
   КАБИНЕТ УЧИТЕЛЯ
   ===================================================================== */
function teacherScreen(){
  return `
  <header class="topbar">
    <div class="brand"><span class="logo small">КР</span> Классная работа</div>
    <div class="userbox">
      <span class="badge-role">Учитель</span>
      <b>${esc(db.currentUser.name)}</b>
      <button class="btn ghost sm" data-action="logout">Выйти</button>
    </div>
  </header>
  <main class="container">
    <nav class="tabs">
      ${tabBtn('create','Выдать задание')}
      ${tabBtn('list','Задания и проверка')}
      ${tabBtn('students','Ученики')}
      ${tabBtn('catalog','Каталог заданий')}
    </nav>
    ${teacherTabContent()}
  </main>`;
}

function tabBtn(id, label){
  return `<button class="tab ${ui.tab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`;
}

function teacherTabContent(){
  if(ui.tab === 'create')   return createTab();
  if(ui.tab === 'list')     return listTab();
  if(ui.tab === 'students') return studentsTab();
  return catalogTab();
}

/* ---------- ВКЛАДКА: ВЫДАТЬ ЗАДАНИЕ ---------- */
function createTab(){
  const subjects = [...new Set(db.tasks.map(t=>t.subject))];
  const visibleTasks = db.tasks.filter(t => !ui.taskSubjectFilter || t.subject === ui.taskSubjectFilter);
  const count = ui.selStudents.size * ui.selTasks.size;

  return `
  <div class="grid2">
    <div class="card">
      <h2>1. Кому</h2>
      <p class="muted small">Отметьте учеников</p>
      <div class="chips">
        ${db.students.length ? db.students.map(s=>`
          <label class="chip ${ui.selStudents.has(s)?'on':''}">
            <input type="checkbox" data-change="toggleStudent" data-name="${esc(s)}"
                   ${ui.selStudents.has(s)?'checked':''}>
            <span>${esc(s)}</span>
          </label>`).join('')
          : '<span class="muted small">Список пуст — добавьте ученика ниже</span>'}
      </div>
      <div class="row">
        <input id="quickStudent" placeholder="Новый ученик: Имя Фамилия">
        <button class="btn" data-action="addStudentQuick">Добавить</button>
      </div>
      ${db.students.length ? `<button class="link" data-action="toggleAllStudents">
        ${ui.selStudents.size === db.students.length ? 'Снять выделение' : 'Выбрать всех'}
      </button>` : ''}
    </div>

    <div class="card">
      <h2>2. Что задать</h2>
      <p class="muted small">Выберите из каталога</p>
      <select data-change="filterTaskSubject" style="margin-top:10px">
        <option value="">Все предметы</option>
        ${subjects.map(s=>`<option value="${esc(s)}" ${ui.taskSubjectFilter===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <div class="tasklist">
        ${visibleTasks.length ? visibleTasks.map(t=>`
          <label class="task-item ${ui.selTasks.has(t.id)?'on':''}">
            <input type="checkbox" data-change="toggleTask" value="${t.id}"
                   ${ui.selTasks.has(t.id)?'checked':''}>
            <div>
              <div class="tt">${esc(t.title)}</div>
              <div class="muted small">${esc(t.subject)}${t.desc ? ' · ' + esc(t.desc) : ''}</div>
            </div>
          </label>`).join('')
          : '<p class="muted small">Заданий нет. Добавьте их в «Каталоге заданий».</p>'}
      </div>
    </div>
  </div>

  <div class="card">
    <h2>3. Срок и отправка</h2>
    <div class="row" style="align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <label class="lbl" style="margin-top:0">Срок сдачи (необязательно)</label>
        <input type="date" id="deadlineInput" value="${ui.deadline}" data-change="setDeadline">
      </div>
      <button class="btn" data-action="createAssignments" style="padding:13px 26px">
        Разослать задания${count ? ` (${count})` : ''}
      </button>
    </div>
    <div class="hint" style="margin-top:16px">
      Выбрано учеников: <b>${ui.selStudents.size}</b> · заданий: <b>${ui.selTasks.size}</b> ·
      будет создано карточек: <b>${count}</b>
    </div>
  </div>`;
}

/* ---------- ВКЛАДКА: ЗАДАНИЯ И ПРОВЕРКА ---------- */
function listTab(){
  const all = db.assignments;
  const done = all.filter(a=>a.done).length;
  const over = all.filter(isOverdue).length;
  const pending = all.length - done;

  return `
  <div class="stats">
    <div class="stat"><div class="num">${all.length}</div><div class="cap">Всего выдано</div></div>
    <div class="stat ok"><div class="num">${done}</div><div class="cap">Выполнено</div></div>
    <div class="stat warn"><div class="num">${pending}</div><div class="cap">Ожидает</div></div>
    <div class="stat danger"><div class="num">${over}</div><div class="cap">Просрочено</div></div>
  </div>

  <div class="card">
    <h2>Все задания</h2>
    <div class="filters" style="margin-top:14px">
      <input id="searchInput" placeholder="Поиск по заданию, предмету или ученику" value="${esc(ui.search)}">
      <select data-change="filterStudent">
        <option value="">Все ученики</option>
        ${db.students.map(s=>`<option value="${esc(s)}" ${ui.filterStudent===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <select data-change="filterStatus">
        <option value=""        ${ui.filterStatus===''?'selected':''}>Все статусы</option>
        <option value="pending" ${ui.filterStatus==='pending'?'selected':''}>Ожидают</option>
        <option value="done"    ${ui.filterStatus==='done'?'selected':''}>Выполнены</option>
        <option value="overdue" ${ui.filterStatus==='overdue'?'selected':''}>Просрочены</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ученик</th><th>Задание</th><th>Выдано</th><th>Срок</th><th>Статус</th><th></th>
          </tr>
        </thead>
        <tbody id="assignTbody">${assignmentRows()}</tbody>
      </table>
    </div>
  </div>

  ${studentSummaryCard()}`;
}

function filteredAssignments(){
  return db.assignments.filter(a => {
    if(ui.filterStudent && a.student !== ui.filterStudent) return false;
    if(ui.filterStatus === 'done'    && !a.done) return false;
    if(ui.filterStatus === 'pending' &&  a.done) return false;
    if(ui.filterStatus === 'overdue' && !isOverdue(a)) return false;
    if(ui.search){
      const q = ui.search.toLowerCase();
      if(!(a.title.toLowerCase().includes(q) ||
           a.student.toLowerCase().includes(q) ||
           a.subject.toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((x,y)=>{
    if(x.done !== y.done) return x.done ? 1 : -1;
    return (x.deadline || '9999').localeCompare(y.deadline || '9999');
  });
}

function assignmentRows(){
  const rows = filteredAssignments();
  if(!rows.length){
    return `<tr><td colspan="6" class="empty">Пока нет заданий по этим фильтрам</td></tr>`;
  }
  return rows.map(a=>`
    <tr class="${a.done?'is-done':''}">
      <td><b>${esc(a.student)}</b></td>
      <td>
        <div style="font-weight:600">${esc(a.title)}</div>
        <div class="muted small">${esc(a.subject)}</div>
      </td>
      <td class="muted small">${fmtDate(a.createdAt)}</td>
      <td class="small">${a.deadline ? fmtDateStr(a.deadline) : '—'}</td>
      <td>${statusBadge(a)}</td>
      <td class="ta-r">
        <button class="btn ghost sm" data-action="delAssignment" data-id="${a.id}">Удалить</button>
      </td>
    </tr>`).join('');
}

function statusBadge(a){
  if(a.done) return `<span class="badge ok">Выполнено${a.doneAt ? ' · ' + fmtDate(a.doneAt) : ''}</span>`;
  if(isOverdue(a)) return `<span class="badge danger">Просрочено</span>`;
  return `<span class="badge warn">Ожидает</span>`;
}

function studentSummaryCard(){
  const names = [...new Set(db.assignments.map(a=>a.student))];
  if(!names.length) return '';
  const rows = names.map(n=>{
    const list = db.assignments.filter(a=>a.student===n);
    const d = list.filter(a=>a.done).length;
    const pct = Math.round(d / list.length * 100);
    return {n, total:list.length, done:d, pct};
  }).sort((a,b)=> b.pct - a.pct);

  return `
  <div class="card">
    <h2>Сводка по ученикам</h2>
    <p class="muted small" style="margin-bottom:14px">Кто как справляется с заданиями</p>
    ${rows.map(r=>`
      <div class="list-row">
        <div style="flex:1;min-width:130px"><b>${esc(r.n)}</b></div>
        <div class="muted small" style="width:120px">${r.done} из ${r.total}</div>
        <div class="progress ${r.pct===100?'full':''}" style="flex:1;max-width:260px"><i style="width:${r.pct}%"></i></div>
        <div style="width:48px;text-align:right;font-weight:700;font-size:13.5px">${r.pct}%</div>
      </div>`).join('')}
  </div>`;
}

/* ---------- ВКЛАДКА: УЧЕНИКИ ---------- */
function studentsTab(){
  return `
  <div class="card">
    <h2>Ученики</h2>
    <p class="muted small">Добавьте класс — и выбирайте из списка при выдаче заданий</p>
    <div class="row">
      <input id="newStudentName" placeholder="Имя и фамилия, например: Пётр Сидоров">
      <button class="btn" data-action="addStudent">Добавить</button>
    </div>
    <div style="margin-top:18px">
      ${db.students.length ? db.students.map(s=>{
        const list = db.assignments.filter(a=>a.student===s);
        return `
        <div class="list-row">
          <div><b>${esc(s)}</b> <span class="muted small">· заданий: ${list.length}</span></div>
          <button class="btn ghost sm" data-action="delStudent" data-name="${esc(s)}">Удалить</button>
        </div>`;
      }).join('') : '<p class="muted small">Список пуст.</p>'}
    </div>
  </div>`;
}

/* ---------- ВКЛАДКА: КАТАЛОГ ---------- */
function catalogTab(){
  const subjects = [...new Set(db.tasks.map(t=>t.subject))];
  return `
  <div class="card">
    <h2>Добавить задание в каталог</h2>
    <p class="muted small">Эти задания вы потом выбираете галочками при рассылке</p>
    <div class="row" style="flex-wrap:wrap">
      <input id="newTaskTitle" placeholder="Название задания" style="flex:2;min-width:220px">
      <input id="newTaskSubject" list="subjectList" placeholder="Предмет" style="flex:1;min-width:150px">
      <datalist id="subjectList">${subjects.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    </div>
    <div class="row">
      <input id="newTaskDesc" placeholder="Описание / комментарий (необязательно)">
      <button class="btn" data-action="addTask">Добавить</button>
    </div>
  </div>

  <div class="card">
    <h2>Каталог (${db.tasks.length})</h2>
    <div style="margin-top:14px">
      ${db.tasks.length ? db.tasks.map(t=>`
        <div class="list-row">
          <div style="flex:1">
            <div style="font-weight:600">${esc(t.title)}</div>
            <div class="muted small">${esc(t.subject)}${t.desc ? ' · ' + esc(t.desc) : ''}</div>
          </div>
          <button class="btn ghost sm" data-action="delTask" data-id="${t.id}">Удалить</button>
        </div>`).join('')
        : '<p class="muted small">Каталог пуст.</p>'}
    </div>
  </div>`;
}

/* =====================================================================
   КАБИНЕТ УЧЕНИКА
   ===================================================================== */
function studentScreen(){
  const name = db.currentUser.name;
  const mine = db.assignments
    .filter(a => a.student.toLowerCase() === name.toLowerCase())
    .sort((x,y)=>{
      if(x.done !== y.done) return x.done ? 1 : -1;
      return (x.deadline || '9999').localeCompare(y.deadline || '9999');
    });

  const done = mine.filter(a=>a.done).length;
  const over = mine.filter(isOverdue).length;

  return `
  <header class="topbar">
    <div class="brand"><span class="logo small">КР</span> Классная работа</div>
    <div class="userbox">
      <span class="badge-role">Ученик</span>
      <b>${esc(name)}</b>
      <button class="btn ghost sm" data-action="logout">Выйти</button>
    </div>
  </header>
  <main class="container">
    <div class="stats">
      <div class="stat"><div class="num">${mine.length}</div><div class="cap">Всего заданий</div></div>
      <div class="stat ok"><div class="num">${done}</div><div class="cap">Выполнено</div></div>
      <div class="stat warn"><div class="num">${mine.length - done}</div><div class="cap">Осталось</div></div>
      <div class="stat danger"><div class="num">${over}</div><div class="cap">Просрочено</div></div>
    </div>

    <h2 style="margin:22px 0 12px">Мои задания</h2>
    ${mine.length ? mine.map(a=>{
      const cls = a.done ? 'done' : (isOverdue(a) ? 'overdue' : '');
      return `
      <div class="acard ${cls}">
        <div style="flex:1;min-width:220px">
          <div class="title">${esc(a.title)}</div>
          <div class="muted small">${esc(a.subject)}${a.desc ? ' · ' + esc(a.desc) : ''}</div>
          <div class="meta">
            ${statusBadge(a)}
            ${a.deadline ? `<span class="muted small">Срок: ${fmtDateStr(a.deadline)}</span>` : ''}
            <span class="muted small">Выдал(а): ${esc(a.teacher)}</span>
          </div>
        </div>
        <div>
          ${a.done
            ? `<button class="btn ghost sm" data-action="markUndone" data-id="${a.id}">Отменить отметку</button>`
            : `<button class="btn ok" data-action="markDone" data-id="${a.id}">Отметить выполненным</button>`}
        </div>
      </div>`;
    }).join('')
    : `<div class="card" style="text-align:center;padding:44px 20px">
         <h3>Заданий пока нет 🎉</h3>
         <p class="muted small">Как только учитель выдаст задание, оно появится здесь.</p>
       </div>`}
  </main>`;
}

/* =====================================================================
   ОБРАБОТЧИКИ
   ===================================================================== */

/* --- клики --- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  switch(a){

    /* авторизация */
    case 'setRole':
      ui.authRole = el.dataset.role;
      render();
      break;

    case 'login': {
      const input = document.getElementById('authName');
      const name = (input?.value || '').trim();
      if(name.length < 2){ toast('Введите имя', 'err'); input?.focus(); return; }
      db.currentUser = { role: ui.authRole, name };
      if(ui.authRole === 'student'){
        const exists = db.students.some(s => s.toLowerCase() === name.toLowerCase());
        if(!exists) db.students.push(name);
      }
      save(); ui.tab = 'create'; render();
      toast(`Добро пожаловать, ${name}!`, 'ok');
      break;
    }

    case 'logout':
      db.currentUser = null;
      ui.selStudents.clear(); ui.selTasks.clear();
      save(); render();
      break;

    /* навигация */
    case 'tab':
      ui.tab = el.dataset.tab;
      render();
      break;

    /* выдача заданий */
    case 'toggleAllStudents': {
      if(ui.selStudents.size === db.students.length) ui.selStudents.clear();
      else db.students.forEach(s => ui.selStudents.add(s));
      render();
      break;
    }

    case 'addStudentQuick': {
      const inp = document.getElementById('quickStudent');
      const name = (inp?.value || '').trim();
      if(name.length < 2){ toast('Введите имя ученика', 'err'); return; }
      if(!db.students.some(s => s.toLowerCase() === name.toLowerCase())){
        db.students.push(name);
      }
      ui.selStudents.add(name);
      save(); render();
      toast('Ученик добавлен и выбран', 'ok');
      break;
    }

    case 'createAssignments': {
      if(!ui.selStudents.size){ toast('Выберите хотя бы одного ученика', 'err'); return; }
      if(!ui.selTasks.size){ toast('Выберите хотя бы одно задание', 'err'); return; }
      const now = Date.now();
      let n = 0;
      ui.selStudents.forEach(st => {
        ui.selTasks.forEach(tid => {
          const t = db.tasks.find(x => x.id === tid);
          if(!t) return;
          db.assignments.push({
            id: uid('a'), taskId: t.id,
            title: t.title, subject: t.subject, desc: t.desc || '',
            student: st, teacher: db.currentUser.name,
            createdAt: now, deadline: ui.deadline || '',
            done: false, doneAt: null
          });
          n++;
        });
      });
      save();
      ui.selStudents.clear(); ui.selTasks.clear(); ui.deadline = '';
      ui.tab = 'list'; render();
      toast(`Отправлено заданий: ${n}`, 'ok');
      break;
    }

    case 'delAssignment': {
      if(!confirm('Удалить это задание?')) return;
      db.assignments = db.assignments.filter(x => x.id !== el.dataset.id);
      save(); render();
      toast('Задание удалено');
      break;
    }

    /* ученики */
    case 'addStudent': {
      const inp = document.getElementById('newStudentName');
      const name = (inp?.value || '').trim();
      if(name.length < 2){ toast('Введите имя и фамилию', 'err'); return; }
      if(db.students.some(s => s.toLowerCase() === name.toLowerCase())){
        toast('Такой ученик уже есть', 'err'); return;
      }
      db.students.push(name);
      save(); render();
      toast('Ученик добавлен', 'ok');
      break;
    }

    case 'delStudent': {
      const name = el.dataset.name;
      if(!confirm(`Удалить ученика «${name}»?`)) return;
      db.students = db.students.filter(s => s !== name);
      ui.selStudents.delete(name);
      save(); render();
      break;
    }

    /* каталог */
    case 'addTask': {
      const title = (document.getElementById('newTaskTitle')?.value || '').trim();
      const subject = (document.getElementById('newTaskSubject')?.value || '').trim() || 'Без предмета';
      const desc = (document.getElementById('newTaskDesc')?.value || '').trim();
      if(title.length < 2){ toast('Введите название задания', 'err'); return; }
      db.tasks.push({ id: uid('t'), title, subject, desc });
      save(); render();
      toast('Задание добавлено в каталог', 'ok');
      break;
    }

    case 'delTask': {
      const id = el.dataset.id;
      if(!confirm('Удалить задание из каталога? Уже выданные копии останутся.')) return;
      db.tasks = db.tasks.filter(t => t.id !== id);
      ui.selTasks.delete(id);
      save(); render();
      break;
    }

    /* ученик отмечает выполнение */
    case 'markDone': {
      const a = db.assignments.find(x => x.id === el.dataset.id);
      if(a){ a.done = true; a.doneAt = Date.now(); save(); render();
             toast('Отлично! Задание отмечено выполненным', 'ok'); }
      break;
    }

    case 'markUndone': {
      const a = db.assignments.find(x => x.id === el.dataset.id);
      if(a){ a.done = false; a.doneAt = null; save(); render(); toast('Отметка снята'); }
      break;
    }
  }
});

/* --- изменения чекбоксов / селектов / дат --- */
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if(!el) return;
  const a = el.dataset.change;

  if(a === 'toggleStudent'){
    const name = el.dataset.name;
    el.checked ? ui.selStudents.add(name) : ui.selStudents.delete(name);
    render();
  }
  else if(a === 'toggleTask'){
    const id = el.value;
    el.checked ? ui.selTasks.add(id) : ui.selTasks.delete(id);
    render();
  }
  else if(a === 'filterTaskSubject'){
    ui.taskSubjectFilter = el.value;
    render();
  }
  else if(a === 'setDeadline'){
    ui.deadline = el.value;
    // обновляем только счётчик, без полной перерисовки
    const btn = document.querySelector('[data-action="createAssignments"]');
    if(btn){
      const c = ui.selStudents.size * ui.selTasks.size;
      btn.textContent = 'Разослать задания' + (c ? ` (${c})` : '');
    }
  }
  else if(a === 'filterStudent'){
    ui.filterStudent = el.value;
    document.getElementById('assignTbody').innerHTML = assignmentRows();
  }
  else if(a === 'filterStatus'){
    ui.filterStatus = el.value;
    document.getElementById('assignTbody').innerHTML = assignmentRows();
  }
});

/* --- живой поиск без потери фокуса --- */
document.addEventListener('input', e => {
  if(e.target.id === 'searchInput'){
    ui.search = e.target.value;
    const tb = document.getElementById('assignTbody');
    if(tb) tb.innerHTML = assignmentRows();
  }
});

/* --- Enter в полях ввода --- */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'authName'){
    document.querySelector('[data-action="login"]')?.click();
  }
  if(e.target.id === 'quickStudent'){
    document.querySelector('[data-action="addStudentQuick"]')?.click();
  }
  if(e.target.id === 'newStudentName'){
    document.querySelector('[data-action="addStudent"]')?.click();
  }
});

/* =====================================================================
   СТАРТ
   ===================================================================== */
render();
</script>
</body>
</html>
