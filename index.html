<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Классная работа</title>
<style>
:root {
  --bg: #f2f5fb; --card: #fff; --ink: #1b2438; --muted: #7b87a0;
  --primary: #4f6ef7; --primary-d: #3a57d8;
  --ok: #16a34a; --warn: #f59e0b; --danger: #ef4444;
  --line: #e5eaf5; --radius: 16px;
  --shadow: 0 6px 24px rgba(35, 55, 110, .08);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px; line-height: 1.5;
  transition: background .2s, color .2s;
}
h1, h2, h3 { margin: 0 0 6px; }
h1 { font-size: 26px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ta-r { text-align: right; }
button { font-family: inherit; }
.ic { display: inline-flex; vertical-align: -2px; flex-shrink: 0; }

/* ============ AUTH ============ */
.auth-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background:
    radial-gradient(1000px 500px at 20% -10%, #dfe7ff 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #e6fbf1 0%, transparent 55%),
    var(--bg);
}
.auth-card {
  width: 100%; max-width: 440px; background: var(--card);
  border-radius: 22px; padding: 34px 30px;
  box-shadow: var(--shadow); border: 1px solid var(--line);
  position: relative;
}
.auth-theme {
  position: absolute; top: 12px; right: 12px;
  background: transparent; border: none; font-size: 20px;
  cursor: pointer; padding: 6px 8px; border-radius: 10px; transition: .15s;
  line-height: 1;
}
.auth-theme:hover { background: rgba(127, 127, 127, .12); }
.logo {
  width: 52px; height: 52px; border-radius: 15px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--primary), #7d8fff);
  color: #fff; font-weight: 800; font-size: 18px; letter-spacing: .5px;
}
.logo.small { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; }
.auth-card h1 { margin-top: 16px; }
.auth-card p { margin: 4px 0 22px; }

label.lbl {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--muted); margin: 16px 0 6px;
}
input, select, textarea {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--line); border-radius: 12px;
  font-size: 15px; font-family: inherit;
  background: #fff; color: var(--ink); outline: none; transition: .15s;
}
textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(79, 110, 247, .12);
}

.role-toggle { display: flex; gap: 8px; background: #eef1f9; padding: 5px; border-radius: 14px; }
.role {
  flex: 1; padding: 10px; border: none; background: transparent;
  border-radius: 10px; font-size: 14px; font-weight: 600;
  color: var(--muted); cursor: pointer; transition: .15s;
}
.role.active {
  background: #fff; color: var(--primary);
  box-shadow: 0 2px 8px rgba(35, 55, 110, .1);
}

/* ============ LAYOUT ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 255, 255, .88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px; gap: 14px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
.userbox { display: flex; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }

.container { max-width: 1080px; margin: 0 auto; padding: 22px 18px 60px; }

.tabs {
  display: flex; gap: 6px; background: #e9edf8; padding: 5px;
  border-radius: 14px; margin-bottom: 20px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1; white-space: nowrap; padding: 10px 14px;
  border: none; background: transparent; border-radius: 10px;
  font-size: 14px; font-weight: 600; color: var(--muted);
  cursor: pointer; transition: .15s;
}
.tab.active {
  background: #fff; color: var(--primary);
  box-shadow: 0 2px 8px rgba(35, 55, 110, .09);
}

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border: none; border-radius: 12px;
  background: var(--primary); color: #fff;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: .15s; white-space: nowrap;
}
.btn:hover { background: var(--primary-d); transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.ghost { background: #eef1f9; color: var(--ink); }
.btn.ghost:hover { background: #e2e7f6; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.ok { background: var(--ok); }
.btn.ok:hover { background: #128a3f; }
.btn.danger { background: var(--danger); }
.btn.block { width: 100%; margin-top: 20px; padding: 13px; }

.link {
  background: none; border: none; color: var(--primary);
  font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0;
}
.link:hover { text-decoration: underline; }

.row { display: flex; gap: 8px; margin-top: 12px; }
.row input { flex: 1; }

/* ============ CHIPS / TASK LIST ============ */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 13px; border: 1.5px solid var(--line);
  border-radius: 999px; cursor: pointer;
  font-size: 13.5px; font-weight: 600; color: var(--muted);
  transition: .15s; user-select: none; background: #fff;
}
.chip:hover { border-color: #c7d3f5; }
.chip.on { background: #eef1ff; border-color: var(--primary); color: var(--primary); }
.chip input { display: none; }

.tasklist {
  max-height: 360px; overflow-y: auto; margin-top: 12px;
  display: flex; flex-direction: column; gap: 8px; padding-right: 4px;
}
.task-item {
  display: flex; gap: 11px; align-items: center;
  padding: 11px 13px; border: 1.5px solid var(--line);
  border-radius: 12px; cursor: pointer;
  transition: .15s; background: #fff;
}
.task-item:hover { border-color: #c7d3f5; background: #fafbff; }
.task-item.on { border-color: var(--primary); background: #f4f6ff; }
.task-item input {
  width: auto; margin: 0; accent-color: var(--primary);
  cursor: pointer; flex-shrink: 0;
}
.task-item .tt { font-weight: 600; font-size: 14px; }
.task-thumb {
  width: 52px; height: 52px; object-fit: cover;
  border-radius: 10px; border: 1px solid var(--line);
  flex-shrink: 0; background: #eef1f9;
}
.task-file-thumb {
  width: 52px; height: 52px; border-radius: 10px;
  border: 1px solid var(--line); flex-shrink: 0;
  background: #eef1f9; display: grid; place-items: center;
  color: var(--muted);
}
.task-img {
  max-width: 100%; max-height: 320px; border-radius: 12px;
  border: 1px solid var(--line); display: block;
  margin-top: 10px; cursor: zoom-in;
}

/* ============ STATS ============ */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 16px;
}
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow);
}
.stat .num { font-size: 28px; font-weight: 800; line-height: 1.1; }
.stat .cap {
  font-size: 12.5px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .4px;
}
.stat.ok .num { color: var(--ok); }
.stat.warn .num { color: var(--warn); }
.stat.danger .num { color: var(--danger); }

/* ============ TABLE ============ */
.filters {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr;
  gap: 10px; margin-bottom: 16px;
}
@media (max-width: 720px) { .filters { grid-template-columns: 1fr; } }
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
th {
  text-align: left; padding: 12px 14px; background: #f7f9fe;
  font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--muted); font-weight: 700;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
td {
  padding: 13px 14px; border-bottom: 1px solid #f0f3fa;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr.is-done td { background: #fbfefc; }
tr:hover td { background: #fafbff; }
.empty { text-align: center; color: var(--muted); padding: 34px 14px !important; }

/* ============ BADGES / PROGRESS ============ */
.badge {
  display: inline-block; padding: 4px 11px;
  border-radius: 999px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap;
}
.badge.ok { background: #e6f7ec; color: #128a3f; }
.badge.warn { background: #fff5e0; color: #b47407; }
.badge.danger { background: #feeaea; color: #c92a2a; }
.badge-role {
  background: #eef1ff; color: var(--primary);
  padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;
}
.progress {
  height: 8px; background: #eef1f9;
  border-radius: 99px; overflow: hidden; min-width: 90px;
}
.progress > i {
  display: block; height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, #4f6ef7, #7d8fff);
}
.progress.full > i { background: linear-gradient(90deg, #16a34a, #38d07a); }

/* ============ STUDENT CARDS ============ */
.acard {
  background: var(--card); border: 1px solid var(--line);
  border-left: 5px solid var(--primary);
  border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow); margin-bottom: 12px;
  display: flex; gap: 16px; align-items: flex-start;
  justify-content: space-between; flex-wrap: wrap;
}
.acard.done { border-left-color: var(--ok); background: #fbfefc; }
.acard.overdue { border-left-color: var(--danger); }
.acard.revision { border-left-color: var(--warn); background: #fff8e6; }
.acard .title { font-weight: 700; font-size: 16px; margin-bottom: 3px; }
.acard .meta {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 10px; align-items: center;
}
.acard .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ============ MISC ============ */
.hint {
  background: #f4f6ff; border: 1px dashed #c7d3f5;
  border-radius: 12px; padding: 12px 14px;
  font-size: 13.5px; color: #4a5680;
}
.review-result {
  margin-top: 14px; padding: 13px 15px; border: 1px solid var(--line);
  border-radius: 12px; background: rgba(79, 110, 247, .045);
  width: 100%;
}
.review-result .review-part + .review-part { margin-top: 10px; }
.review-result .review-text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 80; background: rgba(10, 16, 30, .58);
  display: grid; place-items: center; padding: 18px; overflow-y: auto;
}
.modal-card {
  width: min(100%, 620px); max-height: calc(100vh - 36px); overflow-y: auto;
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 18px; padding: 22px; box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.modal-close {
  flex: 0 0 auto; width: 34px; height: 34px; border: 0; border-radius: 10px;
  background: #eef1f9; color: var(--ink); cursor: pointer; font-size: 20px;
}
.modal-field { margin-top: 14px; }
.modal-field .lbl { margin-top: 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
.list-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 11px 0;
  border-bottom: 1px solid #f0f3fa; flex-wrap: wrap;
}
.list-row:last-child { border-bottom: none; }
.code-big {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 32px; font-weight: 800; letter-spacing: 6px;
  color: var(--primary); background: #f4f6ff;
  border: 2px dashed #c7d3f5; border-radius: 14px;
  padding: 14px 20px; text-align: center;
  user-select: all; margin: 14px 0;
}

/* ============ ATTACH ============ */
.attach {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; background: #eef1ff; color: var(--primary);
  border-radius: 8px; font-size: 13px; font-weight: 600;
  text-decoration: none; max-width: 240px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.attach:hover { background: #e0e6ff; }
.attach svg { flex-shrink: 0; }
.attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.file-upload {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 13px; background: #fff;
  border: 1.5px dashed #c7d3f5; border-radius: 10px;
  cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: var(--primary); transition: .15s;
}
.file-upload:hover { background: #f4f6ff; border-color: var(--primary); }
.file-upload input { display: none; }
.file-upload svg { flex-shrink: 0; }
.file-upload.has-file {
  background: #e6f7ec; border-color: var(--ok);
  color: var(--ok); border-style: solid;
}

.divider { height: 1px; background: var(--line); margin: 20px 0; }

#toasts {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  z-index: 99; display: flex; flex-direction: column;
  gap: 8px; align-items: center;
}
.toast {
  background: #1b2438; color: #fff;
  padding: 12px 20px; border-radius: 12px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  animation: up .25s ease; max-width: 90vw;
}
.toast.ok { background: var(--ok); }
.toast.err { background: var(--danger); }
@keyframes up {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.loading {
  display: grid; place-items: center;
  min-height: 100vh; color: var(--muted); font-size: 15px;
}

/* ============ DARK THEME ============ */
html[data-theme="dark"] {
  --bg: #0f1420; --card: #1a2030; --ink: #e8ecf5; --muted: #8b97b0;
  --primary: #6b86ff; --primary-d: #5470f0; --line: #2a3248;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
}
html[data-theme="dark"] .auth-wrap {
  background:
    radial-gradient(1000px 500px at 20% -10%, #1a2350 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #163a2a 0%, transparent 55%),
    var(--bg);
}
html[data-theme="dark"] input,
html[data-theme="dark"] select,
html[data-theme="dark"] textarea { background: #141a28; color: var(--ink); border-color: var(--line); }
html[data-theme="dark"] .modal-close { background: #232a3c; color: var(--ink); }
html[data-theme="dark"] .review-result { background: rgba(107, 134, 255, .08); }
html[data-theme="dark"] .topbar { background: rgba(15, 20, 32, .88); }
html[data-theme="dark"] .role-toggle,
html[data-theme="dark"] .tabs { background: #141a28; }
html[data-theme="dark"] .role.active,
html[data-theme="dark"] .tab.active { background: #1f2738; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
html[data-theme="dark"] .chip { background: #141a28; border-color: var(--line); color: var(--muted); }
html[data-theme="dark"] .chip:hover { border-color: #3a4560; }
html[data-theme="dark"] .chip.on { background: #1c2540; border-color: var(--primary); color: var(--primary); }
html[data-theme="dark"] .task-item { background: #141a28; border-color: var(--line); }
html[data-theme="dark"] .task-item:hover { background: #1a2030; border-color: #3a4560; }
html[data-theme="dark"] .task-item.on { background: #1c2540; border-color: var(--primary); }
html[data-theme="dark"] .task-thumb { background: #232a3c; border-color: var(--line); }
html[data-theme="dark"] .task-file-thumb { background: #232a3c; border-color: var(--line); color: #8b97b0; }
html[data-theme="dark"] th { background: #141a28; color: var(--muted); }
html[data-theme="dark"] td { border-color: #232a3c; }
html[data-theme="dark"] tr:hover td { background: #1a2030; }
html[data-theme="dark"] tr.is-done td { background: #152218; }
html[data-theme="dark"] tr.is-done:hover td { background: #1a2a20; }
html[data-theme="dark"] .badge.ok { background: #16321f; color: #4ade80; }
html[data-theme="dark"] .badge.warn { background: #3a2a10; color: #fbbf24; }
html[data-theme="dark"] .badge.danger { background: #3a1a1a; color: #f87171; }
html[data-theme="dark"] .badge-role { background: #1c2540; color: #8aa2ff; }
html[data-theme="dark"] .progress { background: #232a3c; }
html[data-theme="dark"] .acard.done { background: #152218; }
html[data-theme="dark"] .acard.revision { background: #2a2010; }
html[data-theme="dark"] .attach { background: #1c2540; color: #8aa2ff; }
html[data-theme="dark"] .attach:hover { background: #253060; }
html[data-theme="dark"] .file-upload { background: #141a28; border-color: #3a4560; color: #8aa2ff; }
html[data-theme="dark"] .file-upload:hover { background: #1c2540; border-color: var(--primary); }
html[data-theme="dark"] .file-upload.has-file { background: #16321f; border-color: #4ade80; color: #4ade80; }
html[data-theme="dark"] .hint { background: #1c2540; border-color: #3a4560; color: #a8b4d8; }
html[data-theme="dark"] .code-big { background: #1c2540; border-color: #3a4560; color: #8aa2ff; }
html[data-theme="dark"] .btn.ghost { background: #232a3c; color: var(--ink); }
html[data-theme="dark"] .btn.ghost:hover { background: #2a3248; }
html[data-theme="dark"] .list-row { border-color: #232a3c; }
html[data-theme="dark"] .logo { background: linear-gradient(135deg, #3a57d8, #6b86ff); }
html[data-theme="dark"] .toast { background: #e8ecf5; color: #0f1420; }
html[data-theme="dark"] .toast.ok { background: var(--ok); color: #fff; }
html[data-theme="dark"] .toast.err { background: var(--danger); color: #fff; }
html[data-theme="dark"] .task-img { border-color: var(--line); }

/* ============ LESSON ============ */
.lesson-current {
  border: 1px solid #cbd6ff; border-radius: 16px; padding: 20px;
  background: linear-gradient(135deg, #f1f4ff, #fff); margin-bottom: 16px;
}
.lesson-current h2 { margin-bottom: 8px; }
.lesson-prompt {
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 18px;
  line-height: 1.6; padding: 20px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--line); margin: 14px 0;
}
.lesson-material { border: 1px solid var(--line); border-radius: 14px; padding: 15px; margin-top: 10px; }
.lesson-material-title { font-weight: 700; font-size: 15px; }
.lesson-material-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
.lesson-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.lesson-index { color: var(--muted); font-size: 13px; font-weight: 700; }
@media (max-width: 600px) { .lesson-current { padding: 15px; } .lesson-prompt { padding: 15px; font-size: 16px; } }
html[data-theme="dark"] .lesson-current { background: linear-gradient(135deg, #1c2540, #1a2030); border-color: #3a4560; }
.lesson-grade-row {
  border: 1px solid var(--line); border-radius: 12px; padding: 13px;
  margin-top: 10px; display: grid; grid-template-columns: minmax(150px, 1fr) minmax(220px, 1.4fr) auto;
  gap: 12px; align-items: center;
}
.lesson-grade-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lesson-grade-fields label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.lesson-grade-fields select, .lesson-grade-row textarea {
  width: 100%; min-width: 0; padding: 9px 10px; border: 1.5px solid var(--line);
  border-radius: 10px; background: #fff; color: var(--ink); font: inherit; font-size: 14px;
}
.lesson-grade-row textarea { grid-column: 1 / -1; resize: vertical; min-height: 54px; }
.lesson-file-preview { margin-top: 10px; }
.lesson-grade-history { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
@media (max-width: 760px) {
  .lesson-grade-row { grid-template-columns: 1fr; }
  .lesson-grade-fields { grid-template-columns: 1fr 1fr; }
}
html[data-theme="dark"] .lesson-grade-fields select,
html[data-theme="dark"] .lesson-grade-row textarea { background:#141a28; color:var(--ink); border-color:var(--line); }
</style>
</head>
<body>

function applyTheme() {
  const theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
}
applyTheme();

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelectorAll('[data-action="toggleTheme"]').forEach(el => {

  });

/* ============================================================
   HELPERS
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU',
  { day: '2-digit', month: '2-digit', year: '2-digit' });

const fmtDateStr = s => {
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: 'numeric' });
};

// Старые записи с done=true считаем уже принятыми, чтобы не сломать существующие данные.
const isAccepted = a => a?.reviewStatus === 'accepted' || (a?.done === true && !a?.reviewStatus);
const isUnderReview = a => a?.reviewStatus === 'pending';
const needsRevision = a => a?.reviewStatus === 'revision';
const hasBeenSubmitted = a => ['pending', 'accepted', 'revision'].includes(a?.reviewStatus) || isAccepted(a);

// Просрочено только то, что ученик ещё не сдал (не pending/accepted/revision).
const isOverdue = a => !hasBeenSubmitted(a) && a.deadline &&
  new Date(a.deadline + 'T23:59:59').getTime() < Date.now();

const genCode = () => Math.random().toString(36).slice(2, 8).toUpperCase();

function getTaskAttachment(t) {
  if (!t) return null;
  if (t.attachmentUrl) {
    return {
      url: t.attachmentUrl,
      name: t.attachmentName || 'файл',
      isImage: t.attachmentType === 'image'
    };
  }
  if (t.imageUrl) return { url: t.imageUrl, name: 'изображение', isImage: true };
  return null;
}

function renderTaskThumb(t) {
  const att = getTaskAttachment(t);
  if (!att) return '';
  if (att.isImage) return `<img src="${esc(att.url)}" class="task-thumb" alt="">`;
  return `<div class="task-file-thumb" title="${esc(att.name)}">${ICON_FILE}</div>`;
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; }, 2400);
  setTimeout(() => el.remove(), 2800);
}

/* ============================================================
   BOOT + загрузка данных
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (registering) return;
  S.user = user;

  if (!user) {
    S.profile = null; S.classDoc = null;
    S.members = []; S.tasks = []; S.assignments = [];
    stopClassSubscriptions();
    S.lessonMaterials = []; S.activeLesson = null; S.lessonGrades = [];
    S.booting = false; render(true); return;
  }

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    S.profile = snap.exists() ? snap.data() : {
      name: user.displayName || '', role: 'student',
      email: user.email, classId: null
    };
    await loadClassData();
  } catch (e) {
    console.error(e);
    toast('Ошибка: ' + e.message, 'err');
  }
  S.booting = false;
  render(true);
});

function stopClassSubscriptions() {
  ['unsubAssignments', 'unsubLessonMaterials', 'unsubActiveLesson', 'unsubLessonGrades'].forEach(key => {
    if (S[key]) { S[key](); S[key] = null; }
  });
}

async function loadClassData() {
  stopClassSubscriptions();
  S.classDoc = null; S.members = []; S.tasks = []; S.assignments = [];
  S.lessonMaterials = []; S.activeLesson = null; S.lessonGrades = [];
  if (!S.profile?.classId) return;

  try {
    const cSnap = await getDoc(doc(db, 'classes', S.profile.classId));
    if (!cSnap.exists()) return;
    S.classDoc = { id: cSnap.id, ...cSnap.data() };

    const [mSnap, tSnap] = await Promise.all([
      getDocs(collection(db, 'classes', S.classDoc.id, 'members')),
      getDocs(collection(db, 'classes', S.classDoc.id, 'tasks'))
    ]);
    S.members = mSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.tasks   = tSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const q = S.profile?.role === 'teacher'
      ? query(
          collection(db, 'assignments'),
          where('classId', '==', S.classDoc.id),
          where('teacherId', '==', S.user.uid)
        )
      : query(
          collection(db, 'assignments'),
          where('classId', '==', S.classDoc.id),
          where('studentId', '==', S.user.uid)
        );
    S.unsubAssignments = onSnapshot(q, snap => {
      S.assignments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (S.booting) return;
      refreshLiveParts();
    }, err => console.error('snapshot:', err));

    const liveRef = doc(db, 'classes', S.classDoc.id, 'lessonLive', 'current');
    S.unsubActiveLesson = onSnapshot(liveRef, snap => {
      S.activeLesson = snap.exists() ? { id: snap.id, ...snap.data() } : null;
      if (!S.booting) refreshLiveParts();
    }, err => console.error('lesson live snapshot:', err));

    const gradesRef = collection(db, 'classes', S.classDoc.id, 'lessonGrades');
    const gradesQuery = S.profile?.role === 'teacher'
      ? gradesRef
      : query(gradesRef, where('studentId', '==', S.user.uid));
    S.unsubLessonGrades = onSnapshot(gradesQuery, snap => {
      S.lessonGrades = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (!S.booting) refreshLiveParts();
    }, err => console.error('lesson grades snapshot:', err));

    if (S.profile?.role === 'teacher') {
      const materialsRef = collection(db, 'classes', S.classDoc.id, 'lessonMaterials');
      S.unsubLessonMaterials = onSnapshot(materialsRef, snap => {
        S.lessonMaterials = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
        if (!S.booting) refreshLessonMaterialsList();
      }, err => console.error('lesson materials snapshot:', err));
    }

  } catch (e) {
    console.error(e);
    toast('Ошибка загрузки: ' + e.message, 'err');
  }
}

function refreshLiveParts() {
  const tb = document.getElementById('assignTbody');

/* ============================================================
   RENDER — сохраняет позицию скролла, если не передан resetScroll
   ============================================================ */
function render(resetScroll = false) {
  const root = document.getElementById('app');
  const y = resetScroll ? 0 : window.scrollY;

  if (S.booting) {
    root.innerHTML = '<div class="loading">Загрузка…</div>';
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }
  if (!S.user || !S.profile) {
    root.innerHTML = authScreen();
  } else if (S.profile.role === 'teacher') {
    root.innerHTML = S.classDoc ? teacherScreen() : createClassScreen();
  } else {
    root.innerHTML = S.classDoc ? studentScreen() : joinClassScreen();
  }
  window.scrollTo({ top: y, behavior: 'instant' });
}

        <button class="link" data-action="authMode" data-mode="${isLogin ? 'register' : 'login'}">
          ${isLogin ? 'Зарегистрироваться' : 'Войти'}

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const pass  = document.getElementById('authPass').value;
  if (!email || !pass) { toast('Введите email и пароль', 'err'); return; }
  if (pass.length < 6) { toast('Пароль должен быть не короче 6 символов', 'err'); return; }

  if (S.ui.authMode === 'login') {
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      const codes = ['auth/user-not-found', 'auth/wrong-password', 'auth/invalid-credential'];
      toast(codes.includes(e.code) ? 'Неверный email или пароль' : e.message, 'err');
    }
    return;
  }

  const name = (document.getElementById('authName').value || '').trim();
  if (name.length < 2) { toast('Введите имя', 'err'); return; }
  registering = true;

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const profile = { name, role: S.ui.authRole, email, classId: null, createdAt: Date.now() };
    await setDoc(doc(db, 'users', cred.user.uid), profile);
    await updateProfile(cred.user, { displayName: name });

    S.user = cred.user;
    S.profile = profile;
    await loadClassData();
    S.booting = false;
    render(true);
    toast('Аккаунт создан!', 'ok');

  } catch (e) {
    if (e.code === 'auth/email-already-in-use') toast('Этот email уже используется', 'err');
    else if (e.code === 'auth/invalid-email') toast('Некорректный email', 'err');
    else if (e.code === 'auth/weak-password') toast('Слишком слабый пароль', 'err');
    else toast(e.message, 'err');
    try { await signOut(auth); } catch (_) {}
  } finally {
    registering = false;
  }
}

function createClassScreen() {
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      ${authThemeBtn()}
      <div class="logo">КР</div>
      <h1>Создайте класс</h1>
      <p class="muted">После создания вы получите код, который нужно сообщить ученикам.</p>
      <label class="lbl">Название класса</label>
      <input id="className" placeholder="Например: 8 «А», математика">
      <button class="btn block" data-action="createClass">Создать класс</button>
      <p class="small muted" style="margin-top:16px;text-align:center">
        <button class="link" data-action="logout">Выйти</button>
      </p>
    </div>
  </div>`;
}

async function handleCreateClass() {
  const name = (document.getElementById('className').value || '').trim();
  if (name.length < 2) { toast('Введите название класса', 'err'); return; }

  const code = genCode();
  const ref = await addDoc(collection(db, 'classes'), {
    name, teacherId: S.user.uid, teacherName: S.profile.name,
    inviteCode: code, createdAt: Date.now()
  });
  await updateDoc(doc(db, 'users', S.user.uid), { classId: ref.id });
  S.profile.classId = ref.id;
  await loadClassData();
  render(true);
  toast(`Класс создан! Код: ${code}`, 'ok');
}

/* ============================================================
   STUDENT — присоединение к классу
   ============================================================ */
function joinClassScreen() {
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      ${authThemeBtn()}
      <div class="logo">КР</div>
      <h1>Присоединитесь к классу</h1>
      <p class="muted">Введите код-приглашение, который дал учитель.</p>
      <label class="lbl">Код класса</label>
      <input id="inviteCode" placeholder="Например: ABC123"
             style="text-transform:uppercase;letter-spacing:3px;font-family:ui-monospace,monospace;font-size:18px;text-align:center"
             maxlength="8">
      <button class="btn block" data-action="joinClass">Войти в класс</button>
      <p class="small muted" style="margin-top:16px;text-align:center">
        <button class="link" data-action="logout">Выйти</button>
      </p>
    </div>
  </div>`;
}

async function handleJoinClass() {
  const code = (document.getElementById('inviteCode').value || '').trim().toUpperCase();
  if (!code) { toast('Введите код', 'err'); return; }

  const snap = await getDocs(query(collection(db, 'classes'), where('inviteCode', '==', code)));
  if (snap.empty) { toast('Класс с таким кодом не найден', 'err'); return; }

  const classId = snap.docs[0].id;

  // Если ученик уже был в другом классе — очищаем старую запись из members
  if (S.profile.classId && S.profile.classId !== classId) {
    try {
      await deleteDoc(doc(db, 'classes', S.profile.classId, 'members', S.user.uid));
    } catch (_) { /* старая запись могла быть уже удалена — не страшно */ }
  }

  await setDoc(doc(db, 'classes', classId, 'members', S.user.uid), {
    name: S.profile.name, email: S.profile.email, joinedAt: Date.now()
  });
  await updateDoc(doc(db, 'users', S.user.uid), { classId });
  S.profile.classId = classId;
  await loadClassData();
  render(true);
  toast('Вы вступили в класс', 'ok');
}

function teacherStatsHtml() {
  const all = S.assignments;
  const accepted = all.filter(isAccepted).length;
  const review = all.filter(isUnderReview).length;
  const over = all.filter(isOverdue).length;
  return `
    <div class="stat"><div class="num">${all.length}</div><div class="cap">Всего выдано</div></div>
    <div class="stat ok"><div class="num">${accepted}</div><div class="cap">Принято</div></div>
    <div class="stat warn"><div class="num">${review}</div><div class="cap">На проверке</div></div>
    <div class="stat danger"><div class="num">${over}</div><div class="cap">Просрочено</div></div>`;
}

function filteredAssignments() {
  return S.assignments.filter(a => {
    if (S.ui.filterStudent && a.studentId !== S.ui.filterStudent) return false;
    if (S.ui.filterStatus === 'accepted' && !isAccepted(a)) return false;
    if (S.ui.filterStatus === 'pending' && !isUnderReview(a)) return false;
    if (S.ui.filterStatus === 'revision' && !needsRevision(a)) return false;
    if (S.ui.filterStatus === 'notSubmitted' && hasBeenSubmitted(a)) return false;
    if (S.ui.filterStatus === 'overdue' && !isOverdue(a)) return false;
    if (S.ui.search) {
      const q = S.ui.search.toLowerCase();
      if (!(String(a.title || '').toLowerCase().includes(q) ||
            String(a.studentName || '').toLowerCase().includes(q) ||
            String(a.subject || '').toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((x, y) => {
    const rank = a => isUnderReview(a) ? 0 : needsRevision(a) ? 1 : isAccepted(a) ? 3 : 2;
    const diff = rank(x) - rank(y);
    if (diff) return diff;
    return (x.deadline || '9999').localeCompare(y.deadline || '9999');
  });
}

function assignmentRows() {
  const rows = filteredAssignments();
  if (!rows.length) return `<tr><td colspan="7" class="empty">Нет заданий по этим фильтрам</td></tr>`;
  return rows.map(a => `
    <tr class="${isAccepted(a) ? 'is-done' : ''}">
      <td><b>${esc(a.studentName)}</b></td>
      <td>
        <div style="font-weight:600;display:flex;align-items:center;gap:6px">
          ${esc(a.title)}
          ${(a.attachmentUrl || a.imageUrl)
            ? `<span class="muted" title="Есть вложение">${ICON_ATTACH}</span>` : ''}
        </div>
        <div class="muted small">${esc(a.subject)}</div>
        ${a.grade != null ? `<div class="small" style="margin-top:4px">Оценка: <b>${esc(a.grade)}</b></div>` : ''}
      </td>
      <td class="muted small">${fmtDate(a.createdAt)}</td>
      <td class="small">${a.deadline ? fmtDateStr(a.deadline) : '—'}</td>
      <td>${statusBadge(a)}</td>
      <td>
        ${a.fileUrl
          ? `<a class="attach" href="${esc(a.fileUrl)}" target="_blank" rel="noopener" title="${esc(a.fileName)}">${ICON_ATTACH}<span class="attach-name">${esc(a.fileName || 'файл')}</span></a>`
          : '<span class="muted small">—</span>'}
      </td>
      <td class="ta-r">
        ${hasBeenSubmitted(a) ? `<button class="btn sm ${isUnderReview(a) ? '' : 'ghost'}" data-action="reviewAssignment" data-id="${a.id}">${isUnderReview(a) ? 'Проверить' : 'Посмотреть'}</button>` : ''}
        <button class="btn ghost sm" data-action="delAssignment" data-id="${a.id}">Удалить</button>
      </td>
    </tr>`).join('');
}

function statusBadge(a) {
  if (isUnderReview(a)) return `<span class="badge warn">На проверке</span>`;
  if (needsRevision(a)) return `<span class="badge warn">На исправлении</span>`;
  if (isAccepted(a)) return `<span class="badge ok">Принято${a.doneAt ? ' · ' + fmtDate(a.doneAt) : ''}</span>`;
  if (isOverdue(a)) return `<span class="badge danger">Просрочено</span>`;
  if (a.fileUrl) return `<span class="badge warn">Файл загружен</span>`;
  return `<span class="badge warn">Не сдано</span>`;
}

function reviewDialogHtml() {
  if (S.profile?.role !== 'teacher' || !S.ui.reviewAssignmentId) return '';
  const a = S.assignments.find(x => x.id === S.ui.reviewAssignmentId);
  if (!a || !hasBeenSubmitted(a)) return '';
  const actionLabel = isUnderReview(a) ? 'Проверка работы' : 'Результат проверки';
  return `
    <div class="modal-backdrop">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
        <div class="modal-head">
          <div>
            <h2 id="reviewTitle">${actionLabel}</h2>
            <div class="muted small" style="margin-top:4px">${esc(a.studentName)} · ${esc(a.title)} · ${esc(a.subject)}</div>
          </div>
          <button class="modal-close" data-action="closeReview" aria-label="Закрыть">×</button>
        </div>
        <div class="hint" style="margin-top:14px">
          ${a.fileUrl
            ? `Файл ученика: <a href="${esc(a.fileUrl)}" target="_blank" rel="noopener" style="color:var(--primary);font-weight:700">${ICON_ATTACH} ${esc(a.fileName || 'Открыть файл')}</a>`
            : 'Ученик пока не прикрепил файл.'}
          ${a.submittedAt ? `<div class="small muted" style="margin-top:5px">Отправлено: ${fmtDate(a.submittedAt)}</div>` : ''}
        </div>
        <div class="modal-field">
          <label class="lbl" for="reviewGrade">Оценка (от 1 до 5)</label>
          <input id="reviewGrade" type="number" min="1" max="5" step="1" value="${a.grade != null ? esc(a.grade) : ''}" placeholder="Например, 5">
        </div>
        <div class="modal-field">
          <label class="lbl" for="reviewFeedback">Комментарий учителя</label>
          <textarea id="reviewFeedback" placeholder="Общий комментарий к работе">${esc(a.teacherFeedback || '')}</textarea>
        </div>
        <div class="modal-field">
          <label class="lbl" for="reviewErrors">Ошибки и что нужно исправить</label>
          <textarea id="reviewErrors" placeholder="Например:
1. Ошибка в задании 2
2. Не хватает решения задачи 4">${esc(a.errors || '')}</textarea>
          <div class="muted small" style="margin-top:5px">Можно перечислить ошибки с новой строки — ученик увидит их в своей карточке.</div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" data-action="closeReview">Отмена</button>
          <button class="btn danger" data-action="sendRevision" data-id="${a.id}">На исправление</button>
          <button class="btn ok" data-action="acceptWork" data-id="${a.id}">Принять работу</button>
        </div>
      </section>
    </div>`;
}

function lessonMaterialsListHtml() {

      <div class="lesson-material-meta">${esc(m.subject || 'Без предмета')} · ${Array.isArray(m.items) ? m.items.length : 0} заданий${m.description ? ' · ' + esc(m.description) : ''}</div>

function lessonAttachmentHtml(lesson) {
  if (!lesson?.attachmentUrl) return '';

  }
  return `<div class="lesson-file-preview"><a class="attach" href="${esc(lesson.attachmentUrl)}" target="_blank" rel="noopener" title="${esc(name)}">${ICON_ATTACH}<span class="attach-name">${esc(name)}</span></a></div>`;
}

}

function studentStatsHtml() {
  const mine = myAssignments();
  const accepted = mine.filter(isAccepted).length;
  const review = mine.filter(isUnderReview).length;
  const over = mine.filter(isOverdue).length;
  return `
    <div class="stat"><div class="num">${mine.length}</div><div class="cap">Всего</div></div>
    <div class="stat ok"><div class="num">${accepted}</div><div class="cap">Принято</div></div>
    <div class="stat warn"><div class="num">${review}</div><div class="cap">На проверке</div></div>
    <div class="stat danger"><div class="num">${over}</div><div class="cap">Просрочено</div></div>`;
}

function myAssignments() {
  return S.assignments
    .filter(a => a.studentId === S.user.uid)
    .sort((x, y) => {
      const rank = a => isUnderReview(a) ? 0 : needsRevision(a) ? 1 : isAccepted(a) ? 3 : 2;
      const diff = rank(x) - rank(y);
      if (diff) return diff;
      return (x.deadline || '9999').localeCompare(y.deadline || '9999');
    });
}

function studentAssignmentsHtml() {
  const mine = myAssignments();
  if (!mine.length) {
    return `<div class="card" style="text-align:center;padding:44px 20px">
      <h3>Заданий пока нет 🎉</h3>
      <p class="muted small">Как только учитель что-то задаст, оно появится здесь.</p>
    </div>`;
  }

  return mine.map(a => {
    const accepted = isAccepted(a);
    const underReview = isUnderReview(a);
    const revision = needsRevision(a);
    // Порядок: проверено (зелёное) → просрочено (красное) → на исправление (жёлтое) → обычное
    const cls = accepted ? 'done'
      : isOverdue(a) ? 'overdue'
      : revision ? 'revision'
      : '';
    const att = getTaskAttachment(a);
    const canEditSubmission = !accepted && !underReview;
    const canSubmit = canEditSubmission && Boolean(a.fileUrl);
    const hasReviewNotes = a.grade != null || a.teacherFeedback || a.errors;
    return `
    <div class="acard ${cls}">
      <div style="flex:1;min-width:220px">
        <div class="title">${esc(a.title)}</div>
        <div class="muted small">${esc(a.subject)}${a.desc ? ' · ' + esc(a.desc) : ''}</div>
        <div class="meta">
          ${statusBadge(a)}
          ${a.deadline ? `<span class="muted small">Срок: ${fmtDateStr(a.deadline)}</span>` : ''}
          <span class="muted small">Учитель: ${esc(a.teacherName || '—')}</span>
        </div>

        ${att ? (att.isImage
          ? `<a href="${esc(att.url)}" target="_blank" rel="noopener">
               <img src="${esc(att.url)}" class="task-img" alt="Вложение к заданию">
             </a>`
          : `<div style="margin-top:10px">
               <a class="attach" href="${esc(att.url)}" target="_blank" rel="noopener" title="${esc(att.name)}">
                 ${ICON_ATTACH}<span class="attach-name">${esc(att.name)}</span>
               </a>
             </div>`
        ) : ''}

        ${a.fileUrl
          ? `<div style="margin-top:10px">
               <a class="attach" href="${esc(a.fileUrl)}" target="_blank" rel="noopener" title="${esc(a.fileName)}">
                 ${ICON_ATTACH}<span class="attach-name">${esc(a.fileName || 'прикреплённый файл')}</span>
               </a>
             </div>`
          : ''}

        ${hasReviewNotes ? `
          <div class="review-result">
            ${a.grade != null ? `<div class="review-part"><b>Оценка: ${esc(a.grade)}</b>${revision ? '<span class="muted small"> · предварительно, исправьте работу</span>' : ''}</div>` : ''}
            ${a.teacherFeedback ? `<div class="review-part"><b>Комментарий учителя</b><div class="review-text">${esc(a.teacherFeedback)}</div></div>` : ''}
            ${a.errors ? `<div class="review-part"><b>Ошибки и исправления</b><div class="review-text">${esc(a.errors)}</div></div>` : ''}
            ${a.reviewedAt ? `<div class="muted small" style="margin-top:8px">Проверено: ${fmtDate(a.reviewedAt)}</div>` : ''}
          </div>` : ''}

        ${underReview ? `<p class="muted small" style="margin-top:12px">Работа отправлена учителю. После проверки здесь появятся оценка и комментарии.</p>` : ''}
      </div>

      <div class="actions">
        ${canEditSubmission ? `
          <label class="file-upload">
            ${ICON_PLUS} ${a.fileUrl ? 'Заменить файл' : 'Прикрепить файл'}
            <input type="file" data-change="uploadFile" data-id="${a.id}">
          </label>
          ${canSubmit ? `<button class="btn ok" data-action="submitAssignment" data-id="${a.id}">${revision ? 'Отправить повторно' : 'Отправить на проверку'}</button>` : ''}
        ` : ''}
        ${accepted ? `<span class="badge ok">Работа принята</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

document.addEventListener('click', async e => {
  // Клик по фону модалки закрывает её.
  if (e.target.classList.contains('modal-backdrop')) {
    if (S.ui.reviewAssignmentId) {
      S.ui.reviewAssignmentId = null;
      render();
    }
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  try {
    switch (a) {
      case 'toggleTheme': toggleTheme(); break;
      case 'authMode': S.ui.authMode = el.dataset.mode; render(true); break;
      case 'authRole': S.ui.authRole = el.dataset.role; render(true); break;
      case 'authSubmit': await handleAuth(); break;
      case 'logout': await signOut(auth); break;
      case 'createClass': await handleCreateClass(); break;
      case 'joinClass': await handleJoinClass(); break;
      case 'tab': S.ui.tab = el.dataset.tab; render(true); break;

      case 'toggleAllStudents':
        if (S.ui.selStudents.size === S.members.length) S.ui.selStudents.clear();
        else S.members.forEach(m => S.ui.selStudents.add(m.id));
        render();
        break;

      case 'createAssignments': await handleCreateAssignments(); break;

      case 'delAssignment': {
        if (!confirm('Удалить это задание?')) break;
        const assign = S.assignments.find(x => x.id === el.dataset.id);
        if (assign?.filePath) {
          try { await supabase.storage.from(SUPABASE_BUCKET).remove([assign.filePath]); }
          catch (err) { console.warn('Не удалить файл:', err); }
        }
        await deleteDoc(doc(db, 'assignments', el.dataset.id));
        toast('Задание удалено');
        break;
      }

      case 'copyCode': {
        try { await navigator.clipboard.writeText(S.classDoc.inviteCode); toast('Код скопирован', 'ok'); }
        catch { toast('Не удалось скопировать', 'err'); }
        break;
      }

      case 'addMemberByEmail': {
        const inp = document.getElementById('addByEmail');
        const email = (inp?.value || '').trim().toLowerCase();
        if (!email) { toast('Введите email', 'err'); break; }
        await handleAddMemberByEmail(email);
        break;
      }

      case 'removeMember': {
        const id = el.dataset.id;
        if (!confirm(`Удалить ${el.dataset.name} из класса?`)) break;
        try {
          await deleteDoc(doc(db, 'classes', S.classDoc.id, 'members', id));
          await updateDoc(doc(db, 'users', id), { classId: null });
        } catch (err) {
          console.error(err);
          toast('Не удалось удалить: ' + (err.code === 'permission-denied'
            ? 'нет прав (проверьте правила Firestore)'
            : err.message), 'err');
          break;
        }
        await loadClassData();
        render();
        toast('Ученик удалён');
        break;
      }

      case 'addTask': await handleAddTask(); break;

      case 'saveLessonMaterial': await saveLessonMaterial(); break;
      case 'cancelEditLesson': S.ui.editLessonId = null; render(); break;
      case 'editLessonMaterial':
        S.ui.editLessonId = el.dataset.id;
        S.ui.tab = 'lesson';
        render();
        break;
      case 'deleteLessonMaterial': await deleteLessonMaterial(el.dataset.id); break;
      case 'startLesson': await startLesson(el.dataset.id); break;
      case 'saveLessonGrade': await saveLessonGrade(el.dataset.studentId); break;
      case 'lessonPrev': await moveLesson(-1); break;
      case 'lessonNext': await moveLesson(1); break;
      case 'endLesson': await endLesson(); break;

      case 'delTask': {
        if (!confirm('Удалить задание из каталога? Уже выданные останутся.')) break;
        const id = el.dataset.id;
        const task = S.tasks.find(t => t.id === id);
        const path = task?.attachmentPath || task?.imagePath;
        if (path) {
          try { await supabase.storage.from(SUPABASE_BUCKET).remove([path]); }
          catch (err) { console.warn('Не удалить вложение:', err); }
        }
        await deleteDoc(doc(db, 'classes', S.classDoc.id, 'tasks', id));
        await loadClassData();
        render();
        break;
      }

      case 'saveClassName': await handleSaveClassName(); break;
      case 'studentLeaveClass': await handleStudentLeaveClass(); break;

      case 'leaveClass': {
        if (!confirm('Покинуть класс? Вы сможете создать новый.')) break;
        await updateDoc(doc(db, 'users', S.user.uid), { classId: null });
        S.profile.classId = null;
        await loadClassData();
        render(true);
        break;
      }

      case 'submitAssignment': await submitAssignment(el.dataset.id); break;
      case 'reviewAssignment':
        if (S.profile?.role !== 'teacher') { toast('Проверять работы может только учитель', 'err'); break; }
        S.ui.reviewAssignmentId = el.dataset.id;
        render();
        break;
      case 'closeReview':
        S.ui.reviewAssignmentId = null;
        render();
        break;
      case 'acceptWork': await saveReview(el.dataset.id, 'accepted'); break;
      case 'sendRevision': await saveReview(el.dataset.id, 'revision'); break;
    }
  } catch (err) {
    console.error(err);
    toast(err.message || 'Ошибка', 'err');
  }
});

async function handleCreateAssignments() {
  if (!S.ui.selStudents.size) { toast('Выберите учеников', 'err'); return; }
  if (!S.ui.selTasks.size)    { toast('Выберите задания', 'err'); return; }

  const batch = writeBatch(db);
  let n = 0;

  S.ui.selStudents.forEach(sid => {
    const m = S.members.find(x => x.id === sid);
    if (!m) return;
    S.ui.selTasks.forEach(tid => {
      const t = S.tasks.find(x => x.id === tid);
      if (!t) return;
      const ref = doc(collection(db, 'assignments'));
      batch.set(ref, {
        classId: S.classDoc.id,
        studentId: sid,
        studentName: m.name,
        taskId: tid,
        title: t.title, subject: t.subject, desc: t.desc || '',
        attachmentUrl:  t.attachmentUrl  || t.imageUrl  || null,
        attachmentPath: t.attachmentPath || t.imagePath || null,
        attachmentName: t.attachmentName || null,
        attachmentType: t.attachmentType || (t.imageUrl ? 'image' : null),
        deadline: S.ui.deadline || '',
        done: false, doneAt: null,
        reviewStatus: 'notSubmitted', submittedAt: null, reviewedAt: null,
        grade: null, teacherFeedback: '', errors: '',
        fileUrl: null, fileName: null, filePath: null,
        teacherId: S.user.uid, teacherName: S.profile.name,
        createdAt: Date.now()
      });
      n++;
    });
  });

  await batch.commit();
  S.ui.selStudents.clear();
  S.ui.selTasks.clear();
  S.ui.deadline = '';
  S.ui.tab = 'submissions';
  render(true);
  toast(`Отправлено заданий: ${n}`, 'ok');
}

async function saveLessonMaterial() {
  if (S.profile?.role !== 'teacher' || !S.classDoc) throw new Error('Создавать материалы может только учитель');
  const title = (document.getElementById('lessonTitle')?.value || '').trim();
  const subject = (document.getElementById('lessonSubject')?.value || '').trim() || 'Без предмета';
  const description = (document.getElementById('lessonDescription')?.value || '').trim();
  const rawItems = (document.getElementById('lessonItems')?.value || '').trim();
  const items = rawItems.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const file = document.getElementById('lessonFile')?.files?.[0] || null;
  const editing = S.ui.editLessonId ? S.lessonMaterials.find(x => x.id === S.ui.editLessonId) : null;

  if (title.length < 2) { toast('Введите название урока', 'err'); return; }
  if (!items.length) { toast('Добавьте хотя бы одно задание', 'err'); return; }
  if (items.length > 40) { toast('В одной заготовке может быть не больше 40 заданий', 'err'); return; }
  if (items.some(x => x.length > 2000)) { toast('Одно задание не должно превышать 2000 символов', 'err'); return; }
  if (file && file.size > 50 * 1024 * 1024) { toast('Файл больше 50 МБ', 'err'); return; }

  const materialRef = editing
    ? doc(db, 'classes', S.classDoc.id, 'lessonMaterials', editing.id)
    : doc(collection(db, 'classes', S.classDoc.id, 'lessonMaterials'));
  let attachmentUrl = editing?.attachmentUrl || null;
  let attachmentPath = editing?.attachmentPath || null;
  let attachmentName = editing?.attachmentName || null;
  let attachmentType = editing?.attachmentType || null;

  if (file) {
    try {
      toast('Загружаю файл к уроку…');
      const safeName = file.name.replace(/[^\w.\-А-Яа-яЁё]/g, '_');
      const path = `tasks/${S.classDoc.id}/lessonMaterials/${materialRef.id}/${Date.now()}_${safeName}`;
      const { error: upErr } = await supabase.storage.from(SUPABASE_BUCKET)
        .upload(path, file, { cacheControl: '3600', upsert: false });
      if (upErr) throw upErr;
      const { data: urlData } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
      attachmentUrl = urlData.publicUrl;
      attachmentPath = path;
      attachmentName = file.name;
      attachmentType = file.type.startsWith('image/') ? 'image' : 'file';
    } catch (err) {
      console.error(err);
      toast('Ошибка загрузки файла: ' + (err.message || err), 'err');
      return;
    }
  }

  const now = Date.now();
  const payload = {
    title, subject, description, items,
    attachmentUrl, attachmentPath, attachmentName, attachmentType,
    updatedAt: now, updatedBy: S.user.uid
  };
  try {
    if (editing) {
      await updateDoc(materialRef, payload);
      if (file && editing.attachmentPath && editing.attachmentPath !== attachmentPath) {
        try { await supabase.storage.from(SUPABASE_BUCKET).remove([editing.attachmentPath]); }
        catch (err) { console.warn('Не удалось удалить старое вложение:', err); }
      }
      toast('Заготовка обновлена', 'ok');
    } else {
      await setDoc(materialRef, { ...payload, createdAt: now, createdBy: S.user.uid });
      toast('Заготовка сохранена', 'ok');
    }
  } catch (err) {
    if (file && attachmentPath) {
      try { await supabase.storage.from(SUPABASE_BUCKET).remove([attachmentPath]); } catch (_) {}
    }
    throw err;
  }
  S.ui.editLessonId = null;
  render();
}

async function deleteLessonMaterial(id) {
  if (S.profile?.role !== 'teacher' || !S.classDoc) throw new Error('Нет прав на удаление заготовки');
  const material = S.lessonMaterials.find(x => x.id === id);
  if (!material) return;
  if (!confirm(`Удалить заготовку «${material.title}»?`)) return;
  await deleteDoc(doc(db, 'classes', S.classDoc.id, 'lessonMaterials', id));
  if (material.attachmentPath && material.attachmentPath !== S.activeLesson?.attachmentPath) {
    try { await supabase.storage.from(SUPABASE_BUCKET).remove([material.attachmentPath]); }
    catch (err) { console.warn('Не удалось удалить вложение заготовки:', err); }
  }
  if (S.ui.editLessonId === id) S.ui.editLessonId = null;
  render();  // перерисовываем, чтобы форма редактирования обновилась / закрылась
  toast('Заготовка удалена');
}

async function startLesson(id) {
  if (S.profile?.role !== 'teacher' || !S.classDoc) throw new Error('Запускать урок может только учитель');
  const material = S.lessonMaterials.find(x => x.id === id);
  if (!material || !Array.isArray(material.items) || !material.items.length) throw new Error('Заготовка не найдена или в ней нет заданий');
  const liveRef = doc(db, 'classes', S.classDoc.id, 'lessonLive', 'current');
  const runId = doc(collection(db, 'classes', S.classDoc.id, 'lessonGrades')).id;
  await setDoc(liveRef, {
    active: true,
    runId,
    materialId: material.id,
    title: material.title,
    subject: material.subject || '',
    description: material.description || '',
    items: material.items,
    attachmentUrl: material.attachmentUrl || null,
    attachmentPath: material.attachmentPath || null,
    attachmentName: material.attachmentName || null,
    attachmentType: material.attachmentType || null,
    activeIndex: 0,
    teacherId: S.user.uid,
    teacherName: S.profile.name || '',
    startedAt: Date.now(),
    updatedAt: Date.now()
  });
  S.ui.editLessonId = null;
  S.ui.tab = 'lesson';
  render(true);
  toast('Урок запущен — первое задание показано ученикам', 'ok');
}

async function saveLessonGrade(studentId) {
  const lesson = S.activeLesson;
  if (S.profile?.role !== 'teacher' || !S.classDoc || !lesson?.runId || lesson.teacherId !== S.user.uid) {
    throw new Error('Оценки может выставлять только учитель этого урока');
  }
  const member = S.members.find(m => m.id === studentId);
  if (!member) throw new Error('Ученик не найден в вашем классе');
  const lessonSelect = document.querySelector(`[data-lesson-grade="lesson"][data-student-id="${CSS.escape(studentId)}"]`);
  const behaviorSelect = document.querySelector(`[data-lesson-grade="behavior"][data-student-id="${CSS.escape(studentId)}"]`);
  const commentInput = document.querySelector(`[data-lesson-grade-comment][data-student-id="${CSS.escape(studentId)}"]`);
  const lessonRaw = lessonSelect?.value || '';
  const behaviorRaw = behaviorSelect?.value || '';
  const lessonGrade = lessonRaw === '' ? null : Number(lessonRaw);
  const behaviorGrade = behaviorRaw === '' ? null : Number(behaviorRaw);
  const comment = (commentInput?.value || '').trim();

  for (const grade of [lessonGrade, behaviorGrade]) {
    if (grade !== null && (!Number.isInteger(grade) || grade < 1 || grade > 5)) {
      throw new Error('Оценки должны быть целыми числами от 1 до 5');
    }
  }

  const gradeId = `${lesson.runId}_${studentId}`;
  const gradeRef = doc(db, 'classes', S.classDoc.id, 'lessonGrades', gradeId);
  const existing = S.lessonGrades.find(g => g.id === gradeId);
  if (lessonGrade === null && behaviorGrade === null && !comment) {
    if (existing) await deleteDoc(gradeRef);
    toast('Оценки очищены');
    return;
  }
  const now = Date.now();
  await setDoc(gradeRef, {
    runId: lesson.runId,
    materialId: lesson.materialId || null,
    lessonTitle: lesson.title || 'Урок',
    lessonSubject: lesson.subject || '',
    studentId,
    studentName: member.name || '',
    lessonGrade,
    behaviorGrade,
    comment,
    teacherId: S.user.uid,
    startedAt: lesson.startedAt || null,
    updatedAt: now
  });
  toast('Оценки сохранены', 'ok');
}

async function moveLesson(direction) {
  const lesson = S.activeLesson;
  if (S.profile?.role !== 'teacher' || !S.classDoc || !lesson?.active || lesson.teacherId !== S.user.uid) {
    throw new Error('Активный урок не найден');
  }
  const max = (lesson.items || []).length - 1;
  const next = Math.max(0, Math.min(max, (Number(lesson.activeIndex) || 0) + direction));
  if (next === lesson.activeIndex) return;
  await updateDoc(doc(db, 'classes', S.classDoc.id, 'lessonLive', 'current'), {
    activeIndex: next, updatedAt: Date.now()
  });
}

async function endLesson() {
  const lesson = S.activeLesson;
  if (S.profile?.role !== 'teacher' || !S.classDoc || !lesson?.active || lesson.teacherId !== S.user.uid) {
    throw new Error('Активный урок не найден');
  }
  if (!confirm('Завершить урок? Текущий вопрос исчезнет из кабинетов учеников.')) return;
  await updateDoc(doc(db, 'classes', S.classDoc.id, 'lessonLive', 'current'), {
    active: false, endedAt: Date.now(), updatedAt: Date.now()
  });
  toast('Урок завершён', 'ok');
}

async function handleAddTask() {
  const title   = (document.getElementById('newTaskTitle').value || '').trim();
  const subject = (document.getElementById('newTaskSubject').value || '').trim() || 'Без предмета';
  const desc    = (document.getElementById('newTaskDesc').value || '').trim();
  const fileInput = document.getElementById('newTaskFile');
  const file = fileInput?.files?.[0];

  if (title.length < 2) { toast('Введите название', 'err'); return; }

  const taskRef = doc(collection(db, 'classes', S.classDoc.id, 'tasks'));
  const taskId = taskRef.id;

  let attachmentUrl = null, attachmentPath = null, attachmentName = null, attachmentType = null;

  if (file) {
    if (file.size > 50 * 1024 * 1024) { toast('Файл больше 50 МБ', 'err'); return; }
    try {
      toast('Загрузка файла…');
      const safeName = file.name.replace(/[^\w.\-А-Яа-яЁё]/g, '_');
      const path = `tasks/${S.classDoc.id}/${taskId}/${Date.now()}_${safeName}`;
      const { error: upErr } = await supabase.storage
        .from(SUPABASE_BUCKET)
        .upload(path, file, { cacheControl: '3600', upsert: false });
      if (upErr) throw upErr;

      const { data: urlData } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
      attachmentUrl  = urlData.publicUrl;
      attachmentPath = path;
      attachmentName = file.name;
      attachmentType = file.type.startsWith('image/') ? 'image' : 'file';
    } catch (err) {
      console.error(err);
      toast('Ошибка загрузки: ' + (err.message || err), 'err');
      return;
    }
  }

  await setDoc(taskRef, {
    title, subject, desc,
    attachmentUrl, attachmentPath, attachmentName, attachmentType,
    createdAt: Date.now()
  });

  await loadClassData();
  render();
  toast('Задание добавлено', 'ok');
}

async function handleAddMemberByEmail(email) {
  const snap = await getDocs(query(
    collection(db, 'users'),
    where('email', '==', email),
    where('role', '==', 'student')
  ));
  if (snap.empty) { toast('Ученик с таким email не найден', 'err'); return; }

  const studentDoc = snap.docs[0];
  const sd = studentDoc.data();
  if (sd.classId) { toast('Ученик уже состоит в классе', 'err'); return; }

  await setDoc(doc(db, 'classes', S.classDoc.id, 'members', studentDoc.id), {
    name: sd.name, email: sd.email, joinedAt: Date.now()
  });
  await updateDoc(doc(db, 'users', studentDoc.id), { classId: S.classDoc.id });
  await loadClassData();
  render();
  toast('Ученик добавлен в класс', 'ok');
}

/* ============================================================
   УЧЕНИК — выход из класса
   ============================================================ */
async function handleStudentLeaveClass() {
  if (!confirm('Покинуть класс? Вы сможете вернуться по коду-приглашению.')) return;
  try {
    await deleteDoc(doc(db, 'classes', S.classDoc.id, 'members', S.user.uid));
    await updateDoc(doc(db, 'users', S.user.uid), { classId: null });
    S.profile.classId = null;
    await loadClassData();
    render(true);
    toast('Вы покинули класс');
  } catch (err) {
    console.error(err);
    toast('Ошибка: ' + (err.message || err), 'err');
  }
}

/* ============================================================
   ЗАГРУЗКА ДОМАШКИ УЧЕНИКА
   ============================================================ */
async function uploadHomeworkFile(assignmentId, inputEl) {
  const file = inputEl?.files?.[0];
  if (!file) return;

  if (file.size > 50 * 1024 * 1024) {
    toast('Файл больше 50 МБ', 'err');
    inputEl.value = '';
    return;
  }

  const assign = S.assignments.find(a => a.id === assignmentId);
  if (!assign || S.profile?.role !== 'student' || assign.studentId !== S.user.uid) {
    throw new Error('Задание не найдено');
  }
  if (isAccepted(assign) || isUnderReview(assign)) {
    toast('Сейчас нельзя менять файл этой работы', 'err');
    inputEl.value = '';
    return;
  }

  try {
    toast('Загрузка файла…');

    const safeName = file.name.replace(/[^\w.\-А-Яа-яЁё]/g, '_');
    const path = `${S.classDoc.id}/${assignmentId}/${Date.now()}_${safeName}`;
    const oldPath = assign.filePath;

    const { error: upErr } = await supabase.storage
      .from(SUPABASE_BUCKET)
      .upload(path, file, { cacheControl: '3600', upsert: false });
    if (upErr) throw upErr;

    const { data: urlData } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(path);

    await updateDoc(doc(db, 'assignments', assignmentId), {
      fileUrl: urlData.publicUrl,
      fileName: file.name,
      filePath: path,
      fileUploadedAt: Date.now()
    });

    if (oldPath) {
      try { await supabase.storage.from(SUPABASE_BUCKET).remove([oldPath]); }
      catch (err) { console.warn('Не удалось удалить предыдущий файл:', err); }
    }

    toast('Файл прикреплён', 'ok');
  } catch (err) {
    console.error(err);
    toast('Ошибка загрузки: ' + (err.message || err), 'err');
  } finally {
    inputEl.value = '';
  }
}

async function submitAssignment(id) {
  const assign = S.assignments.find(a => a.id === id);
  if (!assign || assign.studentId !== S.user.uid) throw new Error('Задание не найдено');
  if (!assign.fileUrl) { toast('Сначала прикрепите файл с выполненной работой', 'err'); return; }
  if (isUnderReview(assign)) { toast('Работа уже находится на проверке'); return; }
  if (isAccepted(assign)) { toast('Работа уже принята учителем'); return; }

  await updateDoc(doc(db, 'assignments', id), {
    reviewStatus: 'pending',
    submittedAt: Date.now(),
    submissionAttempt: (Number(assign.submissionAttempt) || 0) + 1
  });
  toast('Работа отправлена учителю на проверку', 'ok');
}

async function saveReview(id, decision) {
  if (S.profile?.role !== 'teacher' || !S.classDoc) throw new Error('Нет прав на проверку работ');
  const assign = S.assignments.find(a => a.id === id);
  if (!assign || assign.classId !== S.classDoc.id || assign.teacherId !== S.user.uid) {
    throw new Error('Работа не найдена в вашем классе');
  }
  // Старые задания, отмеченные done=true до появления проверки, можно оценить и без файла.
  if (!hasBeenSubmitted(assign) || (!assign.fileUrl && !isAccepted(assign))) {
    throw new Error('У ученика нет отправленной работы для проверки');
  }

  const gradeRaw = (document.getElementById('reviewGrade')?.value || '').trim();
  const grade = gradeRaw === '' ? null : Number(gradeRaw);
  const teacherFeedback = (document.getElementById('reviewFeedback')?.value || '').trim();
  const errors = (document.getElementById('reviewErrors')?.value || '').trim();

  if (grade !== null && (!Number.isInteger(grade) || grade < 1 || grade > 5)) {
    toast('Оценка должна быть целым числом от 1 до 5', 'err');
    return;
  }
  if (decision === 'accepted' && grade === null) {
    toast('Поставьте оценку перед принятием работы', 'err');
    return;
  }
  if (decision === 'revision' && !teacherFeedback && !errors) {
    toast('Напишите комментарий или перечислите ошибки, чтобы ученик понял, что исправить', 'err');
    return;
  }

  const now = Date.now();
  await updateDoc(doc(db, 'assignments', id), {
    reviewStatus: decision,
    grade,
    teacherFeedback,
    errors,
    reviewedAt: now,
    reviewedBy: S.user.uid,
    done: decision === 'accepted',
    doneAt: decision === 'accepted' ? now : null
  });

  S.ui.reviewAssignmentId = null;
  render();
  toast(decision === 'accepted' ? 'Работа принята, оценка сохранена' : 'Работа возвращена на исправление', 'ok');
}
